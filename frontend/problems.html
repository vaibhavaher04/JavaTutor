<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Java Problems | JavaTutor</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        :root { --bg-base: #0d1117; --bg-surface: #161b22; --border-color: #30363d; --accent-orange: #f8981d; --text-main: #c9d1d9; }
        body { background: var(--bg-base); color: var(--text-main); font-family: 'Inter', sans-serif; margin: 0; }
        header { background: var(--bg-surface); border-bottom: 1px solid var(--border-color); padding: 1rem 3rem; display: flex; justify-content: space-between; align-items: center; }
        .container { max-width: 1000px; margin: 2rem auto; padding: 0 1.5rem; }
        
        .filter-bar { display: flex; gap: 0.8rem; margin-bottom: 1.5rem; }
        .filter-btn { background: var(--bg-surface); border: 1px solid var(--border-color); color: var(--text-main); padding: 0.4rem 1rem; border-radius: 20px; font-size: 0.85rem; cursor: pointer; }
        .filter-btn.active { background: var(--accent-orange); color: #fff; border-color: var(--accent-orange); }

        .problem-table { width: 100%; border-collapse: collapse; background: var(--bg-surface); border: 1px solid var(--border-color); border-radius: 8px; overflow: hidden; }
        .problem-table th, .problem-table td { padding: 1rem; text-align: left; border-bottom: 1px solid var(--border-color); }
        .problem-table th { background: #21262d; font-size: 0.85rem; color: #8b949e; }
        .problem-link { color: #fff; font-weight: 600; text-decoration: none; }
        .problem-link:hover { color: var(--accent-orange); }
        
        .Easy { color: #3fb950; } .Medium { color: #d29922; } .Hard { color: #f85149; }
    </style>
</head>
<body>
    <header>
        <div style="font-weight: 700; color: #fff;"><i class="fa-solid fa-code"></i> Java<span style="color: var(--accent-orange);">Tutor</span> | Problem Catalog</div>
        <a href="prepare.html" style="color: #8b949e; text-decoration: none; font-size: 0.9rem;"><i class="fa-solid fa-arrow-left"></i> Back to Topics</a>
    </header>

    <div class="container">
        <h1>Java Coding Challenges</h1>
        <div class="filter-bar">
            <button class="filter-btn active" onclick="loadCatalog('All')">All</button>
            <button class="filter-btn" onclick="loadCatalog('Easy')">Easy</button>
            <button class="filter-btn" onclick="loadCatalog('Medium')">Medium</button>
            <button class="filter-btn" onclick="loadCatalog('Hard')">Hard</button>
        </div>

        <table class="problem-table">
            <thead>
                <tr>
                    <th style="width: 10%;">ID</th>
                    <th>Title</th>
                    <th style="width: 20%;">Difficulty</th>
                    <th style="width: 15%;">Action</th>
                </tr>
            </thead>
            <tbody id="problemsTbody">
                <tr><td colspan="4" style="text-align:center;">Loading problems from database...</td></tr>
            </tbody>
        </table>
    </div>

    <script>
        async function loadCatalog(diff) {
            document.querySelectorAll('.filter-btn').forEach(b => b.classList.toggle('active', b.textContent === diff));
            const tbody = document.getElementById('problemsTbody');
            tbody.innerHTML = `<tr><td colspan="4" style="text-align:center;">Loading...</td></tr>`;

            const url = diff === 'All' ? "http://localhost:8000/api/problems" : `http://localhost:8000/api/problems?difficulty=${diff}`;
            const res = await fetch(url);
            const problems = await res.json();

            tbody.innerHTML = "";
            problems.forEach(p => {
                const tr = document.createElement('tr');
                tr.innerHTML = `
                    <td>${p.id}</td>
                    <td><a href="workspace.html?problem_id=${p.id}" class="problem-link">${p.title}</a></td>
                    <td class="${p.difficulty}">${p.difficulty}</td>
                    <td><a href="workspace.html?problem_id=${p.id}" style="color: var(--accent-orange); font-size: 0.9rem;">Solve <i class="fa-solid fa-chevron-right"></i></a></td>
                `;
                tbody.appendChild(tr);
            });
        }
        window.onload = () => loadCatalog('All');
    </script>
</body>
</html>
